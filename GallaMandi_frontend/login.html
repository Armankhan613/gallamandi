<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | GallaMandi</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main class="amazon-login">
        <div class="logo">
            <h1>GallaMandi</h1>
        </div>
        <div class="login-box">
            <h2>Welcome back</h2>
            <form id="loginForm"><label for="email">Email</label><input type="email" id="email" autocomplete="email"
                    required><label for="password">Password</label><input type="password" id="password"
                    autocomplete="current-password" required><button type="submit">Sign in</button>
                <p id="message" class="message"></p>
            </form>
        </div>
        <div class="register-section">
            <hr>
            <p>New to GallaMandi?</p><a href="register.html" class="register-btn">Create an account</a>
        </div>
    </main>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
